<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <title>Knotical — crow's nest POV, calm water over a reef</title>

  <!-- ============ SKY ============ -->
  <rect x="0" y="0" width="1280" height="180" fill="#BEE9F2"/>
  <rect x="0" y="120" width="1280" height="60" fill="#DCF4F7"/>

  <!-- flat cloud shapes -->
  <path d="M120 60 h150 v22 h-40 v14 h-130 v-14 h20 z" fill="#FFFFFF" opacity="0.85"/>
  <path d="M880 42 h190 v26 h-56 v16 h-160 v-16 h26 z" fill="#FFFFFF" opacity="0.85"/>
  <path d="M520 88 h120 v18 h-120 z" fill="#FFFFFF" opacity="0.6"/>

  <!-- ============ DISTANT ISLAND (landmark) ============ -->
  <path d="M905 178 l38 -58 l30 26 l34 -48 l46 80 z" fill="#7B6A55"/>
  <path d="M973 146 l34 -48 l46 80 h-58 z" fill="#95836A"/>
  <path d="M905 178 l38 -58 l24 20 l-18 38 z" fill="#5E7F49"/>
  <path d="M1002 118 l20 -20 l31 60 h-30 z" fill="#6E9455"/>
  <rect x="893" y="176" width="176" height="6" fill="#4E8C9E"/>

  <!-- ============ WATER — deep base ============ -->
  <rect x="0" y="180" width="1280" height="540" fill="#1D6FA6"/>

  <!-- horizon haze band -->
  <rect x="0" y="180" width="1280" height="34" fill="#3E93BE"/>
  <rect x="0" y="206" width="1280" height="22" fill="#2E82B2"/>

  <!-- ============ DEPTH BANDS over the reef (hard-stepped) ============ -->
  <!-- band 4 : outer drop-off -->
  <path d="M-20 300 C 180 268, 420 300, 610 282 C 810 262, 980 300, 1300 276 L1300 720 L-20 720 Z" fill="#2481B4"/>
  <!-- band 3 -->
  <path d="M-20 372 C 150 336, 380 372, 560 350 C 760 326, 950 366, 1300 340 L1300 720 L-20 720 Z" fill="#3AA0C6"/>
  <!-- band 2 -->
  <path d="M60 470 C 190 404, 400 436, 545 412 C 700 386, 880 430, 1180 404 L1240 720 L20 720 Z" fill="#5CC3D4"/>
  <!-- band 1 : shallow -->
  <path d="M210 560 C 300 470, 470 492, 600 470 C 730 448, 880 484, 1060 470 L1120 720 L150 720 Z" fill="#88E0D4"/>
  <!-- sandbar : shallowest -->
  <path d="M360 660 C 430 540, 560 548, 660 528 C 760 508, 850 540, 940 540 L980 720 L320 720 Z" fill="#C6E7B9"/>
  <path d="M470 720 C 500 604, 610 588, 700 578 C 790 568, 840 594, 880 600 L900 720 Z" fill="#E2EFC2"/>

  <!-- reef structures seen through the water : silhouette + value only -->
  <g opacity="0.55">
    <path d="M250 486 l34 -30 l30 24 l26 -14 l22 34 l-38 26 l-52 -8 z" fill="#1C5F72"/>
    <path d="M905 462 l30 -26 l34 22 l28 -10 l16 32 l-44 22 l-50 -12 z" fill="#1C5F72"/>
    <path d="M1080 540 l40 -34 l38 30 l-14 42 l-52 12 z" fill="#1C5F72"/>
    <path d="M150 620 l46 -38 l44 34 l-18 48 l-60 10 z" fill="#1C5F72"/>
    <path d="M700 500 l24 -20 l26 18 l-10 28 l-34 6 z" fill="#2A7285"/>
    <path d="M560 630 l38 -30 l34 26 l-14 38 l-48 8 z" fill="#2A7285"/>
  </g>

  <!-- ============ SURFACE DETAIL ============ -->
  <!-- gentle swell lines : flat lighter strips -->
  <g fill="#FFFFFF" opacity="0.18">
    <path d="M0 250 h300 v7 h-300 z"/>
    <path d="M420 236 h260 v6 h-260 z"/>
    <path d="M760 258 h340 v7 h-340 z"/>
    <path d="M100 320 h380 v8 h-380 z"/>
    <path d="M620 336 h300 v8 h-300 z"/>
    <path d="M980 300 h300 v7 h-300 z"/>
    <path d="M40 430 h260 v10 h-260 z"/>
    <path d="M840 448 h380 v10 h-380 z"/>
    <path d="M300 566 h300 v12 h-300 z"/>
    <path d="M760 600 h340 v12 h-340 z"/>
  </g>

  <!-- hard-stepped specular sparkles -->
  <g fill="#FFFFFF">
    <path d="M180 268 l9 -9 l9 9 l-9 9 z"/>
    <path d="M340 300 l7 -7 l7 7 l-7 7 z"/>
    <path d="M980 254 l8 -8 l8 8 l-8 8 z"/>
    <path d="M1120 330 l10 -10 l10 10 l-10 10 z"/>
    <path d="M470 246 l6 -6 l6 6 l-6 6 z"/>
    <path d="M60 356 l8 -8 l8 8 l-8 8 z"/>
    <path d="M1180 420 l9 -9 l9 9 l-9 9 z"/>
    <path d="M240 402 l7 -7 l7 7 l-7 7 z"/>
    <path d="M880 372 l8 -8 l8 8 l-8 8 z"/>
    <path d="M660 288 l7 -7 l7 7 l-7 7 z"/>
  </g>

  <!-- ============ BOAT ============ -->
  <g transform="translate(600 452) rotate(-9)">
    <!-- hull shadow cast down onto the sea floor, offset + soft-ish -->
    <path d="M-70 60 L18 -178 L92 60 L34 148 L-16 148 Z" fill="#12556F" opacity="0.42"/>

    <!-- foam ring at the waterline -->
    <path d="M-104 34 L-6 -224 L106 34 L44 168 L-46 168 Z" fill="#FFFFFF" opacity="0.75"/>
    <path d="M-96 30 L-6 -212 L98 30 L40 158 L-42 158 Z" fill="#BFEAF0" opacity="0.9"/>

    <!-- hull outer -->
    <path d="M-84 26 L-6 -206 L88 26 L34 150 L-36 150 Z" fill="#7A5334"/>
    <!-- deck -->
    <path d="M-68 28 L-6 -182 L72 28 L28 134 L-30 134 Z" fill="#C79A66"/>
    <!-- deck planking -->
    <g stroke="#B0864F" stroke-width="3" opacity="0.7">
      <path d="M-46 30 L-6 -170"/><path d="M-20 32 L-2 -172"/>
      <path d="M8 32 L6 -172"/><path d="M36 30 L14 -170"/>
    </g>
    <!-- stern deck -->
    <path d="M-30 134 L28 134 L20 152 L-24 152 Z" fill="#A87F4E"/>

    <!-- CARGO : an enormous stone head, lashed badly -->
    <g transform="translate(2 4)">
      <path d="M-44 -6 L-28 -60 L26 -66 L46 -14 L34 44 L-26 50 Z" fill="#9EA7A2"/>
      <path d="M-28 -60 L26 -66 L46 -14 L18 -8 Z" fill="#B9C2BC"/>
      <path d="M-44 -6 L-26 50 L34 44 L18 -8 Z" fill="#848D89"/>
      <path d="M-14 -30 l14 -3 l3 12 l-14 3 z" fill="#5E6764"/>
      <path d="M14 -34 l13 -2 l3 12 l-14 2 z" fill="#5E6764"/>
      <path d="M-8 4 l30 -4 l2 9 l-30 4 z" fill="#5E6764"/>
    </g>
    <!-- lashing ropes over the cargo -->
    <g stroke="#E6D2A8" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-62 -14 L52 -26"/>
      <path d="M-56 26 L46 16"/>
    </g>

    <!-- mainsail boomed out to starboard, seen foreshortened from above -->
    <path d="M4 -70 L128 -122 L150 -6 L26 22 Z" fill="#F4EDD8"/>
    <path d="M4 -70 L128 -122 L136 -70 L14 -34 Z" fill="#FFFFFF"/>
    <path d="M4 -70 L26 22 L34 20 L12 -68 Z" fill="#CBBE9C"/>
    <!-- jib -->
    <path d="M-2 -186 L-84 -104 L-8 -86 Z" fill="#F4EDD8"/>
    <path d="M-2 -186 L-84 -104 L-46 -108 Z" fill="#FFFFFF"/>

    <!-- mast base on deck -->
    <circle cx="2" cy="-66" r="11" fill="#6B4726"/>
    <circle cx="2" cy="-66" r="6" fill="#8A5F35"/>

    <!-- crew -->
    <g>
      <circle cx="-40" cy="88" r="8" fill="#E0574B"/>
      <path d="M-48 96 h16 v22 h-16 z" fill="#3E5C86"/>
      <circle cx="52" cy="-40" r="8" fill="#4FA36B"/>
      <path d="M44 -32 h16 v22 h-16 z" fill="#E2C77E"/>
      <circle cx="-52" cy="-96" r="8" fill="#E8B44A"/>
      <path d="M-60 -88 h16 v22 h-16 z" fill="#5B4C7A"/>
    </g>

    <!-- wake trailing astern -->
    <path d="M-30 152 L-58 300 L14 300 L26 152 Z" fill="#FFFFFF" opacity="0.28"/>
  </g>

  <!-- ============ FOREGROUND : crow's nest + rigging ============ -->
  <!-- shrouds running down past the viewer -->
  <g stroke="#E0CBA0" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M300 720 C 380 560, 470 500, 528 452"/>
    <path d="M980 720 C 900 560, 790 496, 700 448"/>
  </g>
  <g stroke="#C9B187" stroke-width="4" fill="none">
    <path d="M336 720 C 404 574, 486 516, 540 470"/>
    <path d="M944 720 C 878 574, 782 512, 692 466"/>
  </g>

  <!-- nest rim -->
  <path d="M-20 720 C 160 620, 420 578, 640 578 C 860 578, 1120 620, 1300 720 Z" fill="#7A5334"/>
  <path d="M-20 720 C 170 638, 424 598, 640 598 C 856 598, 1110 638, 1300 720 Z" fill="#9B6E42"/>
  <path d="M-20 720 C 180 664, 430 628, 640 628 C 850 628, 1100 664, 1300 720 Z" fill="#6B4726"/>
  <!-- rim slats -->
  <g fill="#5A3B20" opacity="0.55">
    <path d="M180 660 l16 -6 l22 62 l-18 0 z"/>
    <path d="M400 622 l16 -4 l14 62 l-18 0 z"/>
    <path d="M640 610 l16 0 l4 62 l-18 0 z"/>
    <path d="M880 622 l16 4 l-8 62 l-18 0 z"/>
    <path d="M1090 656 l16 8 l-20 58 l-18 0 z"/>
  </g>
</svg>
