<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <title>Knotical — crow's nest POV, deep water on open swell</title>

  <!-- ============ SKY ============ -->
  <rect x="0" y="0" width="1280" height="196" fill="#A6DAEE"/>
  <rect x="0" y="126" width="1280" height="70" fill="#CDEAF4"/>
  <rect x="0" y="176" width="1280" height="20" fill="#E6F5FA"/>
  <path d="M60 52 h210 v24 h-58 v16 h-176 v-16 h24 z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M760 34 h240 v26 h-70 v18 h-200 v-18 h30 z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M420 96 h150 v18 h-150 z" fill="#FFFFFF" opacity="0.55"/>

  <!-- ============ DISTANT LANDMARK — twin sea stacks ============ -->
  <path d="M228 194 l16 -74 l14 20 l10 -44 l24 98 z" fill="#6E6A63"/>
  <path d="M268 96 l24 98 h-18 l-14 -66 z" fill="#8A867C"/>
  <path d="M312 194 l14 -52 l20 52 z" fill="#6E6A63"/>
  <rect x="216" y="190" width="146" height="7" fill="#2E7FA8"/>

  <!-- ============ WATER — deep, opaque ============ -->
  <rect x="0" y="194" width="1280" height="526" fill="#0F4570"/>

  <!-- distance haze -->
  <rect x="0" y="194" width="1280" height="26" fill="#3C8FB6"/>
  <rect x="0" y="214" width="1280" height="22" fill="#2C7AA4"/>
  <rect x="0" y="232" width="1280" height="20" fill="#1E6893"/>

  <!-- ============ SWELL : stepped ridges, lit face + shadow face ============ -->
  <!-- row A (far) -->
  <path d="M0 252 L120 244 L250 254 L390 244 L520 256 L660 244 L800 254 L940 244 L1080 256 L1280 246 L1280 270 L0 270 Z" fill="#2179A5"/>
  <path d="M0 268 L120 260 L250 270 L390 260 L520 272 L660 260 L800 270 L940 260 L1080 272 L1280 262 L1280 288 L0 288 Z" fill="#14567F"/>

  <!-- row B -->
  <path d="M-20 302 L110 286 L260 306 L410 286 L560 308 L720 286 L880 306 L1030 288 L1180 308 L1300 292 L1300 324 L-20 324 Z" fill="#2A88B4"/>
  <path d="M-20 320 L110 304 L260 324 L410 304 L560 326 L720 304 L880 324 L1030 306 L1180 326 L1300 310 L1300 352 L-20 352 Z" fill="#12527C"/>

  <!-- row C -->
  <path d="M-20 372 L120 342 L290 376 L450 342 L620 380 L790 342 L960 376 L1120 344 L1300 378 L1300 412 L-20 412 Z" fill="#2F92BE"/>
  <path d="M-20 396 L120 366 L290 400 L450 366 L620 404 L790 366 L960 400 L1120 368 L1300 402 L1300 450 L-20 450 Z" fill="#11507A"/>

  <!-- row D -->
  <path d="M-20 470 L150 420 L340 480 L530 418 L720 484 L900 420 L1090 478 L1300 424 L1300 470 L-20 520 Z" fill="#3699C4"/>
  <path d="M-20 506 L150 456 L340 516 L530 454 L720 520 L900 456 L1090 514 L1300 460 L1300 560 L-20 596 Z" fill="#0F4A73"/>

  <!-- row E (near, largest) -->
  <path d="M-20 616 L180 528 L400 632 L620 522 L840 638 L1060 528 L1300 626 L1300 720 L-20 720 Z" fill="#3EA3CC"/>
  <path d="M-20 664 L180 578 L400 682 L620 572 L840 688 L1060 578 L1300 676 L1300 720 L-20 720 Z" fill="#0D4269"/>

  <!-- ============ WHITECAPS : hard-edged, no soft falloff ============ -->
  <g fill="#FFFFFF">
    <path d="M104 258 l52 -6 l30 8 l-46 6 z" opacity="0.85"/>
    <path d="M382 250 l58 -6 l24 8 l-52 6 z" opacity="0.85"/>
    <path d="M928 250 l60 -6 l26 8 l-54 6 z" opacity="0.85"/>
    <path d="M96 292 l84 -8 l40 12 l-72 8 z" opacity="0.9"/>
    <path d="M700 292 l90 -8 l38 12 l-78 8 z" opacity="0.9"/>
    <path d="M1014 294 l86 -8 l40 12 l-74 8 z" opacity="0.9"/>
    <path d="M104 348 l120 -12 l56 16 l-104 12 z"/>
    <path d="M770 348 l124 -12 l54 16 l-106 12 z"/>
    <path d="M132 426 l160 -18 l72 22 l-140 18 z"/>
    <path d="M880 426 l166 -18 l70 22 l-142 18 z"/>
    <path d="M150 536 l200 -22 l96 34 l-180 24 z"/>
    <path d="M1040 536 l204 -24 l90 34 l-186 26 z"/>
    <path d="M596 530 l180 -20 l84 32 l-166 22 z"/>
  </g>
  <g fill="#CDE9F5">
    <path d="M150 552 l200 -20 l70 26 l-186 20 z"/>
    <path d="M596 546 l180 -18 l64 24 l-168 18 z"/>
    <path d="M1040 552 l204 -22 l66 26 l-190 22 z"/>
  </g>

  <!-- streaked foam trails down the wave faces -->
  <g fill="#FFFFFF" opacity="0.3">
    <path d="M240 566 l30 -4 l18 66 l-30 4 z"/>
    <path d="M700 560 l28 -4 l16 64 l-28 4 z"/>
    <path d="M1130 566 l30 -4 l16 66 l-30 4 z"/>
    <path d="M330 444 l22 -3 l12 44 l-22 3 z"/>
    <path d="M980 444 l22 -3 l12 44 l-22 3 z"/>
  </g>

  <!-- specular sparkle on the lit faces -->
  <g fill="#FFFFFF">
    <path d="M470 330 l8 -8 l8 8 l-8 8 z"/>
    <path d="M840 318 l7 -7 l7 7 l-7 7 z"/>
    <path d="M210 392 l9 -9 l9 9 l-9 9 z"/>
    <path d="M1160 384 l8 -8 l8 8 l-8 8 z"/>
    <path d="M620 264 l6 -6 l6 6 l-6 6 z"/>
  </g>

  <!-- ============ BOAT — heeled over on the swell ============ -->
  <g transform="translate(650 430) rotate(13)">
    <!-- foam collar -->
    <path d="M-100 30 L-4 -216 L102 30 L42 160 L-44 160 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M-92 26 L-4 -204 L94 26 L38 150 L-40 150 Z" fill="#B9E2F0" opacity="0.85"/>

    <!-- hull -->
    <path d="M-80 24 L-4 -198 L84 24 L32 144 L-34 144 Z" fill="#7A5334"/>
    <path d="M-64 26 L-4 -176 L68 26 L26 128 L-28 128 Z" fill="#C79A66"/>
    <g stroke="#B0864F" stroke-width="3" opacity="0.7">
      <path d="M-44 28 L-4 -164"/><path d="M-18 30 L0 -166"/>
      <path d="M10 30 L8 -166"/><path d="M34 28 L16 -164"/>
    </g>
    <path d="M-28 128 L26 128 L18 146 L-22 146 Z" fill="#A87F4E"/>

    <!-- CARGO : a grand piano, obviously -->
    <g transform="translate(0 6) rotate(-6)">
      <path d="M-48 -34 L28 -44 C 60 -40, 68 -6, 52 22 C 36 48, -12 54, -44 40 Z" fill="#2B2B30"/>
      <path d="M-48 -34 L28 -44 C 54 -40, 62 -14, 50 6 L-44 18 Z" fill="#3E3E46"/>
      <path d="M-46 -20 L20 -28 L22 -18 L-44 -10 Z" fill="#EFEAE0"/>
      <g fill="#1B1B1F">
        <path d="M-38 -22 l5 -1 l1 7 l-5 1 z"/><path d="M-26 -24 l5 -1 l1 7 l-5 1 z"/>
        <path d="M-14 -25 l5 -1 l1 7 l-5 1 z"/><path d="M0 -27 l5 -1 l1 7 l-5 1 z"/>
        <path d="M12 -28 l5 -1 l1 7 l-5 1 z"/>
      </g>
      <!-- legs, one already off the deck -->
      <path d="M-40 40 l10 -2 l4 16 l-10 2 z" fill="#1B1B1F"/>
      <path d="M44 20 l10 -2 l4 16 l-10 2 z" fill="#1B1B1F"/>
    </g>
    <g stroke="#E6D2A8" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-60 -28 L60 -40"/>
      <path d="M-56 34 L54 22"/>
    </g>

    <!-- sails, spilling wind -->
    <path d="M2 -66 L-118 -134 L-146 -14 L-22 24 Z" fill="#F4EDD8"/>
    <path d="M2 -66 L-118 -134 L-128 -78 L-10 -34 Z" fill="#FFFFFF"/>
    <path d="M2 -66 L-22 24 L-30 22 L-6 -64 Z" fill="#CBBE9C"/>
    <path d="M-4 -178 L74 -102 L2 -82 Z" fill="#F4EDD8"/>
    <path d="M-4 -178 L74 -102 L38 -108 Z" fill="#FFFFFF"/>

    <circle cx="0" cy="-64" r="11" fill="#6B4726"/>
    <circle cx="0" cy="-64" r="6" fill="#8A5F35"/>

    <!-- crew : one clinging to the rail -->
    <g>
      <circle cx="-46" cy="76" r="8" fill="#E0574B"/>
      <path d="M-54 84 h16 v22 h-16 z" fill="#3E5C86"/>
      <circle cx="-58" cy="-52" r="8" fill="#4FA36B"/>
      <path d="M-66 -44 h16 v20 h-16 z" fill="#E2C77E"/>
      <circle cx="46" cy="-120" r="8" fill="#E8B44A"/>
      <path d="M38 -112 h16 v20 h-16 z" fill="#5B4C7A"/>
    </g>

    <!-- spray off the bow -->
    <path d="M-14 -216 l40 -22 l30 16 l-34 26 z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M-40 -196 l-38 -20 l-14 26 l40 16 z" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- ============ FOREGROUND : crow's nest + rigging ============ -->
  <g stroke="#E0CBA0" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M290 720 C 372 566, 476 494, 552 440"/>
    <path d="M990 720 C 918 566, 812 486, 736 434"/>
  </g>
  <g stroke="#C9B187" stroke-width="4" fill="none">
    <path d="M328 720 C 398 580, 494 512, 566 458"/>
    <path d="M952 720 C 892 580, 800 504, 726 452"/>
  </g>

  <path d="M-20 720 C 160 626, 420 584, 640 584 C 860 584, 1120 626, 1300 720 Z" fill="#7A5334"/>
  <path d="M-20 720 C 170 644, 424 604, 640 604 C 856 604, 1110 644, 1300 720 Z" fill="#9B6E42"/>
  <path d="M-20 720 C 180 670, 430 634, 640 634 C 850 634, 1100 670, 1300 720 Z" fill="#6B4726"/>
  <g fill="#5A3B20" opacity="0.55">
    <path d="M180 666 l16 -6 l22 60 l-18 0 z"/>
    <path d="M400 628 l16 -4 l14 60 l-18 0 z"/>
    <path d="M640 616 l16 0 l4 60 l-18 0 z"/>
    <path d="M880 628 l16 4 l-8 60 l-18 0 z"/>
    <path d="M1090 662 l16 8 l-20 56 l-18 0 z"/>
  </g>
</svg>
